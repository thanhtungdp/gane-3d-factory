# game.davidtung.net → Vite 5173 (dev)
#
# CÀI (cần root):
#   sudo cp deploy/nginx/game.davidtung.net.conf /etc/nginx/sites-available/game.davidtung.net
#   sudo ln -sf /etc/nginx/sites-available/game.davidtung.net /etc/nginx/sites-enabled/game.davidtung.net
#   sudo certbot --nginx -d game.davidtung.net --redirect --non-interactive --agree-tos -m <email>
#   sudo nginx -t && sudo systemctl reload nginx
#
# Lưu ý: config này chỉ có tác dụng nếu DNS/Cloudflare origin của game.davidtung.net
# đang trỏ về máy này. Nếu domain đang đi qua Cloudflare Tunnel/Worker khác, phải
# đổi route ở Cloudflare (xem deploy/README.md).
#
# HMR của Vite dùng WebSocket trên chính origin 443; location / đã forward Upgrade.
# Nếu HMR vẫn không kết nối, thêm clientPort 443 vào vite.config.ts khi chạy domain.

map $http_upgrade $connection_upgrade_game {
    default upgrade;
    ''      close;
}

server {
    server_name game.davidtung.net;

    access_log /var/log/nginx/game.davidtung.access.log;
    error_log  /var/log/nginx/game.davidtung.error.log;

    client_max_body_size 20m;
    large_client_header_buffers 4 32k;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;

        # Giữ Host thật: Vite 8 chặn host lạ nếu không khai báo allowedHosts.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HMR + WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_game;

        # Dev: không cache, không buffer
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache 1;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 75s;
    }

    listen 80;
    listen [::]:80;
}

# certbot --nginx sẽ tự thêm listen 443 + ssl_certificate vào server block trên.
# Nếu muốn cấu hình tay trước khi có cert, đừng thêm 443 vội — nginx -t sẽ fail
# vì file cert chưa tồn tại.
