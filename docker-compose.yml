services:
  game:
    build: .
    ports:
      - "8788:8788"
    environment:
      PORT: 8788
      HOST: 0.0.0.0
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8788}
      DATA_DIR: /data
      IP_HASH_SALT: ${IP_HASH_SALT:-doi-salt-nay}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      CRM_WEBHOOK_URL: ${CRM_WEBHOOK_URL:-}
      CRM_WEBHOOK_SECRET: ${CRM_WEBHOOK_SECRET:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-doi-token-admin}
      VITE_BOOKING_URL: ${VITE_BOOKING_URL:-}
      VITE_SHOW_PRICE: ${VITE_SHOW_PRICE:-1}
    volumes:
      - ./.data:/data
    restart: unless-stopped
