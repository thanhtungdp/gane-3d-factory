# saokim-3d.davidtung.net → Hánh trình Sao Kim (Vite build + Hono API) on 127.0.0.1:8789
server {
    server_name saokim-3d.davidtung.net;
    listen 80;
    listen [::]:80;

    client_max_body_size 20m;   # logo/ảnh upload trong onboarding

    location / {
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_omb;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
